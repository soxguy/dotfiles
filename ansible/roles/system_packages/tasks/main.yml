---
# Linux (apt) packages
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  become: yes
  when: ansible_facts['os_family'] != "Darwin"

- name: Set eza/exa package name based on Ubuntu version
  set_fact:
    eza_package: "{{ 'exa' if ansible_facts.distribution_version is version('24.04', '<') else 'eza' }}"
  when: ansible_facts['os_family'] != "Darwin"

- name: Install essential packages (Linux)
  apt:
    name:
      - git
      - bat
      - nala
      - fzf
      - "{{ eza_package }}"
      - dnsutils
      - ca-certificates
      - mtr
      - jq
      - curl
      - build-essential
      - vim
      - zsh
      - unzip
      - expect
      - wslu
    state: present
  become: yes
  when: ansible_facts['os_family'] != "Darwin"

# Docker Desktop leaves dangling completion symlinks into /mnt/wsl/docker-desktop
# when it is stopped or uninstalled, which makes compinit error on every new shell
- name: Check for zsh vendor-completions directory (Linux)
  stat:
    path: /usr/share/zsh/vendor-completions
  register: vendor_completions
  when: ansible_facts['os_family'] != "Darwin"

- name: Remove broken zsh vendor-completion symlinks (Linux)
  shell: find /usr/share/zsh/vendor-completions -xtype l -print -delete
  register: broken_completions
  changed_when: broken_completions.stdout != ""
  become: yes
  when:
    - ansible_facts['os_family'] != "Darwin"
    - vendor_completions.stat.exists | default(false)

# macOS (Homebrew) packages
- name: Install essential packages (macOS)
  community.general.homebrew:
    name:
      - git
      - bat
      - eza
      - fzf
      - bind
      - mtr
      - jq
      - curl
      - vim
      - zsh
      - unzip
      - expect
    state: present
  when: ansible_facts['os_family'] == "Darwin"
